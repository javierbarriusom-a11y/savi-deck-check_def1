<style>
:root {
  --cream: #f7f1e4;
  --paper: #fffaf0;
  --ice: #dff8ff;
  --lemon: #ffd84d;
  --red: #e62929;
  --blue: #0071bc;
  --mint: #68d391;
  --ink: #151515;
  --muted: #54504a;
  --soft: #ded5c3;
  --deep: #0d1b2a;
  --white: #fff;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #070707; color: var(--ink); font-family: var(--sans); }
body { overflow: hidden; }
button { font: inherit; }

.topbar {
  position: fixed;
  z-index: 20;
  inset: 0 0 auto;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 22px;
  color: var(--white);
  mix-blend-mode: difference;
  pointer-events: none;
}
.brand { font-family: var(--serif); font-size: 30px; line-height: 1; white-space: nowrap; }
.brand span { color: var(--red); }
.nav-pills { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.nav-pills button, .controls button {
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  min-height: 34px;
  padding: 6px 11px;
  border-radius: 999px;
  cursor: pointer;
}
.nav-pills button { font-size: 12px; text-transform: uppercase; }
.nav-pills button.is-active, .controls button:hover { background: currentColor; color: #000; }

.controls {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 999px;
  background: rgba(0,0,0,.62);
  color: #fff;
  backdrop-filter: blur(18px);
}
.controls button { font-size: 13px; border-color: rgba(255,255,255,.34); }
.counter { min-width: 78px; text-align: center; font-family: var(--mono); font-size: 12px; }
.progress {
  position: fixed;
  z-index: 35;
  left: 0;
  bottom: 0;
  height: 4px;
  width: 100%;
  background: rgba(255,255,255,.14);
}
.progress span { display: block; width: 0; height: 100%; background: var(--red); transition: width .35s ease; }

deck-stage {
  display: block;
  width: 100vw;
  height: 100svh;
  overflow: hidden;
  position: relative;
}

section.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: clamp(58px, 6vw, 96px);
  background:
    linear-gradient(90deg, rgba(230,41,41,.08) 0 1px, transparent 1px 100%),
    linear-gradient(0deg, rgba(0,113,188,.07) 0 1px, transparent 1px 100%),
    var(--paper);
  background-size: 96px 96px;
  overflow: hidden;
  opacity: 0;
  transform: translateX(4%) scale(.985);
  pointer-events: none;
  transition: opacity .38s ease, transform .48s cubic-bezier(.2,.8,.2,1);
}
section.slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
section.slide.before { transform: translateX(-4%) scale(.985); }
section.slide.dark {
  background:
    radial-gradient(circle at 18% 22%, rgba(230,41,41,.32), transparent 23%),
    radial-gradient(circle at 78% 70%, rgba(0,113,188,.3), transparent 22%),
    var(--deep);
  color: var(--white);
}
section.slide.red { background: var(--red); color: var(--white); }
section.slide.blue { background: var(--blue); color: var(--white); }
section.slide.ice { background: var(--ice); }
section.slide.lemon { background: var(--lemon); }

.slide-grid {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: clamp(22px, 3vh, 40px);
}
.slide-head, .slide-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-color: currentColor;
}
.slide-head { padding-bottom: 18px; border-bottom: 1px solid rgba(21,21,21,.22); }
.slide.dark .slide-head, .slide.red .slide-head, .slide.blue .slide-head,
.slide.dark .slide-foot, .slide.red .slide-foot, .slide.blue .slide-foot { border-color: rgba(255,255,255,.24); }
.slide-foot { padding-top: 16px; border-top: 1px solid rgba(21,21,21,.22); color: var(--muted); font-size: 13px; }
.slide.dark .slide-foot, .slide.red .slide-foot, .slide.blue .slide-foot { color: rgba(255,255,255,.72); }
.eyebrow, .meta, .chip {
  font-family: var(--mono);
  text-transform: uppercase;
  font-size: clamp(11px, 1vw, 15px);
  line-height: 1.35;
}
.eyebrow { color: var(--muted); }
.slide.dark .eyebrow, .slide.red .eyebrow, .slide.blue .eyebrow { color: rgba(255,255,255,.74); }

.title {
  font-family: var(--serif);
  font-size: clamp(54px, 9vw, 138px);
  line-height: .94;
  font-weight: 400;
  margin: 0;
  text-wrap: balance;
  letter-spacing: 0;
}
.title.small { font-size: clamp(40px, 5.6vw, 76px); }
.title.xl { font-size: clamp(72px, 14vw, 190px); }
.slide:first-child .title { font-size: clamp(48px, 7vw, 104px); }
.slide:first-child .subtitle { max-width: 760px; font-size: clamp(18px, 1.8vw, 28px); }
.slide:first-child .poster { min-height: 500px; }
.subtitle {
  margin: 18px 0 0;
  max-width: 980px;
  font-size: clamp(19px, 1.8vw, 29px);
  line-height: 1.28;
  color: var(--muted);
  text-wrap: pretty;
}
.slide.dark .subtitle, .slide.red .subtitle, .slide.blue .subtitle { color: rgba(255,255,255,.76); }
.body { font-size: clamp(16px, 1.25vw, 21px); line-height: 1.4; color: var(--muted); }
.slide.dark .body, .slide.red .body, .slide.blue .body { color: rgba(255,255,255,.76); }

.content.two { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(320px, .98fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
.content.split { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 80px); align-items: stretch; }
.content.center { display: grid; align-content: center; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid { display: grid; gap: 18px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.card, .stat-card, .timeline-item, .idea, .cell {
  border: 1px solid rgba(21,21,21,.34);
  border-radius: 8px;
  background: rgba(255,255,255,.46);
  padding: clamp(18px, 2vw, 30px);
}
.slide.dark .card, .slide.red .card, .slide.blue .card,
.slide.dark .stat-card, .slide.red .stat-card, .slide.blue .stat-card,
.slide.dark .timeline-item, .slide.red .timeline-item, .slide.blue .timeline-item,
.slide.dark .idea, .slide.red .idea, .slide.blue .idea,
.slide.dark .cell, .slide.red .cell, .slide.blue .cell {
  border-color: rgba(255,255,255,.28);
  background: rgba(255,255,255,.08);
}
.card h3, .idea h3, .cell h3 { margin: 0; font-size: clamp(21px, 1.8vw, 30px); line-height: 1.1; font-weight: 650; }
.card p, .idea p, .cell p { margin: 8px 0 0; }
.num {
  font-family: var(--serif);
  font-size: clamp(64px, 8vw, 128px);
  line-height: .82;
  font-weight: 400;
}
.stat-card strong { display: block; font-family: var(--serif); font-size: clamp(54px, 6vw, 104px); line-height: .9; font-weight: 400; }
.stat-card span { display: block; margin-top: 12px; color: var(--muted); font-size: clamp(16px, 1.45vw, 22px); }
.slide.dark .stat-card span, .slide.red .stat-card span, .slide.blue .stat-card span { color: rgba(255,255,255,.76); }

.agenda-list { counter-reset: agenda; display: grid; gap: 14px; }
.agenda-row {
  counter-increment: agenda;
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 24px;
  align-items: start;
  border-top: 1px solid rgba(21,21,21,.25);
  padding-top: 16px;
}
.agenda-row::before { content: counter(agenda, decimal-leading-zero); font-family: var(--mono); color: var(--red); }
.agenda-row h3 { margin: 0; font-size: clamp(28px, 3vw, 48px); font-family: var(--serif); font-weight: 400; }
.agenda-row p { margin: 4px 0 0; }

.poster {
  min-height: 560px;
  border-radius: 8px;
  border: 1px solid rgba(21,21,21,.34);
  background:
    linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.2)),
    repeating-linear-gradient(90deg, var(--red) 0 42px, var(--paper) 42px 84px);
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.poster::before {
  content: "";
  width: min(42vw, 360px);
  aspect-ratio: .62;
  border-radius: 50% 50% 44% 44%;
  background: linear-gradient(180deg, var(--lemon) 0 48%, #fb9f32 48% 58%, #b55a28 58% 100%);
  box-shadow: 0 34px 0 rgba(0,0,0,.18);
  transform: rotate(-8deg);
}
.poster::after {
  content: "100";
  position: absolute;
  font-family: var(--serif);
  font-size: clamp(110px, 14vw, 210px);
  color: rgba(0,113,188,.86);
  bottom: 28px;
  right: 36px;
}
.qr-block {
  position: absolute;
  left: 34px;
  bottom: 34px;
  width: 106px;
  height: 106px;
  background:
    linear-gradient(90deg, #111 16px, transparent 16px 26px, #111 26px 42px, transparent 42px 58px, #111 58px 78px, transparent 78px),
    linear-gradient(#111 15px, transparent 15px 28px, #111 28px 46px, transparent 46px 62px, #111 62px 80px, transparent 80px),
    #fff;
  border: 10px solid #fff;
}

.phone {
  width: min(430px, 100%);
  min-height: 620px;
  margin: 0 auto;
  border: 12px solid #121212;
  border-radius: 34px;
  background: #eef9ef;
  padding: 28px 20px;
  box-shadow: 0 24px 60px rgba(0,0,0,.18);
}
.bubble {
  max-width: 84%;
  margin: 12px 0;
  padding: 14px 16px;
  border-radius: 16px;
  background: #fff;
  font-size: 17px;
  line-height: 1.28;
}
.bubble.me { margin-left: auto; background: #d9ffd3; }

.journey {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 14px;
}
.journey .card { min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; }
.icon { font-size: clamp(34px, 4vw, 58px); line-height: 1; }
.timeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
.timeline-item { min-height: 210px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
.timeline-item b { font-family: var(--serif); font-size: clamp(30px, 3.1vw, 44px); font-weight: 400; color: var(--red); }
.timeline-item h3 { font-size: clamp(17px, 1.35vw, 21px); }
.timeline-item .body { font-size: clamp(13px, .9vw, 15px); line-height: 1.28; }

.matrix { display: grid; grid-template-columns: 190px repeat(4, 1fr); border: 1px solid rgba(21,21,21,.34); border-radius: 8px; overflow: hidden; }
.matrix div { padding: 16px; min-height: 72px; border-right: 1px solid rgba(21,21,21,.18); border-bottom: 1px solid rgba(21,21,21,.18); background: rgba(255,255,255,.4); }
.matrix div:nth-child(5n) { border-right: 0; }
.matrix .head { font-family: var(--mono); text-transform: uppercase; font-size: 12px; background: rgba(21,21,21,.08); }
.dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }
.dot.light { background: rgba(230,41,41,.24); border: 1px solid rgba(230,41,41,.55); }

.bars { display: grid; gap: 12px; margin-top: 22px; }
.bar { display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 16px; }
.bar span { font-family: var(--mono); font-size: 12px; text-transform: uppercase; }
.bar i { display: block; height: 30px; border-radius: 999px; background: linear-gradient(90deg, var(--red), var(--blue)); }

.roadmap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.roadmap .card { min-height: 310px; display: flex; flex-direction: column; justify-content: space-between; }
.phase { font-family: var(--mono); color: var(--red); text-transform: uppercase; }

.grid.cols-5 .card,
.grid.cols-5 .idea { padding: 18px; }
.grid.cols-5 .card .icon { font-size: 32px; }
.grid.cols-5 .card h3,
.grid.cols-5 .idea h3 { font-size: clamp(18px, 1.45vw, 24px); }
.grid.cols-5 .card .body,
.grid.cols-5 .idea .body { font-size: clamp(14px, 1vw, 17px); line-height: 1.32; }

.dashboard {
  border: 1px solid rgba(21,21,21,.34);
  border-radius: 8px;
  padding: 20px;
  background: #101418;
  color: #f3f7fa;
  box-shadow: 0 24px 60px rgba(0,0,0,.2);
}
.dashboard-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
.dash-card { border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 18px; background: rgba(255,255,255,.06); }
.dash-card strong { display: block; font-family: var(--serif); font-size: 54px; line-height: 1; font-weight: 400; }
.spark { height: 140px; margin-top: 16px; background: linear-gradient(160deg, transparent 0 24%, rgba(104,211,145,.75) 25% 30%, transparent 31% 44%, rgba(255,216,77,.8) 45% 51%, transparent 52% 64%, rgba(230,41,41,.82) 65% 70%, transparent 71%); border-bottom: 1px solid rgba(255,255,255,.22); }

.source {
  font-size: 11px;
  line-height: 1.35;
  max-width: 900px;
}
a { color: inherit; }

@media (max-width: 900px) {
  body { overflow: auto; }
  deck-stage { height: auto; overflow: visible; }
  section.slide {
    position: relative;
    min-height: 100svh;
    opacity: 1;
    transform: none;
    pointer-events: auto;
    display: block;
  }
  .controls, .progress { display: none; }
  .topbar { position: sticky; mix-blend-mode: normal; background: #111; color: #fff; }
  .nav-pills { overflow-x: auto; justify-content: flex-start; }
  .content.two, .content.split, .grid.cols-2, .grid.cols-3, .grid.cols-4, .grid.cols-5,
  .journey, .timeline, .roadmap, .dashboard-grid { grid-template-columns: 1fr; }
  .matrix { grid-template-columns: 1fr; }
  .matrix div { border-right: 0; }
  .poster { min-height: 420px; }
}
</style>
</head>

const deck = document.getElementById("deck");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
let current = Math.max(0, Math.min(slides.length - 1, Number(location.hash.replace("#slide-", "")) - 1 || 0));

const iconSet = ["🍦", "📱", "💬", "🎯", "🏆", "📸", "🧾", "📍", "🔑", "🔢", "🎰", "🏅", "🎴", "🤝", "🔮"];

function safe(text) {
  return String(text || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
}

function header(slide, i) {
  return `
    <div class="slide-head">
      <div class="brand">savi<span>.</span></div>
      <div class="eyebrow">${safe(slide.eyebrow || "")}</div>
      <div class="meta">${String(i + 1).padStart(2, "0")} / ${slides.length}</div>
    </div>`;
}

function footer(slide) {
  const source = slide.foot ? safe(slide.foot) : "Frigo 100 · propuesta visual interactiva · Savi";
  return `<div class="slide-foot"><div class="source">${source}</div><div>Inicio · Atras · Siguiente</div></div>`;
}

function titleBlock(slide, small = false) {
  return `
    <div>
      <h1 class="title ${small ? "small" : ""}">${safe(slide.title)}</h1>
      ${slide.subtitle ? `<p class="subtitle">${safe(slide.subtitle)}</p>` : ""}
    </div>`;
}

function renderCards(items = [], cols = 3) {
  return `<div class="grid cols-${cols}">${items.map((item, idx) => `
    <article class="card">
      <div class="icon">${iconSet[idx % iconSet.length]}</div>
      <h3>${safe(item[0])}</h3>
      <p class="body">${safe(item[1])}</p>
    </article>`).join("")}</div>`;
}

function layout(slide, i) {
  if (slide.layout === "cover") {
    return `<div class="content two"><div>${titleBlock(slide)}</div><div class="poster"><div class="qr-block"></div></div></div>`;
  }
  if (slide.layout === "agenda") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="agenda-list">${slide.items.map((item) => `
      <div class="agenda-row"><div><h3>${safe(item[0])}</h3><p class="body">${safe(item[1])}</p></div></div>`).join("")}</div></div>`;
  }
  if (slide.layout === "chapter") {
    return `<div class="content center">${titleBlock(slide)}</div>`;
  }
  if (slide.layout === "stats") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="grid cols-4">${slide.stats.map((stat) => `
      <article class="stat-card"><strong>${safe(stat[0])}</strong><span>${safe(stat[1])}</span></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "timeline") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="timeline">${slide.items.map((item) => `
      <article class="timeline-item"><b>${safe(item[0])}</b><div><h3>${safe(item[1])}</h3><p class="body">${safe(item[2])}</p></div></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "compare") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="grid cols-2">${slide.items.map((item) => `
      <article class="card"><div class="num">${safe(item[0])}</div><p class="body">${safe(item[1])}</p></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "poster") {
    return `<div class="content two"><div>${titleBlock(slide, true)}${renderCards(slide.items, 2)}</div><div class="poster"><div class="qr-block"></div></div></div>`;
  }
  if (slide.layout === "journey") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="journey">${slide.items.map((item, idx) => `
      <article class="card"><div class="meta">${String(idx + 1).padStart(2, "0")}</div><div class="icon">${iconSet[idx]}</div><div><h3>${safe(item[0])}</h3><p class="body">${safe(item[1])}</p></div></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "phone") {
    return `<div class="content two"><div>${titleBlock(slide, true)}${renderCards(slide.items, 5)}</div><div class="phone">
      <div class="bubble">Hola, soy Frigo. Escanea el cartel y desbloquea tu Momento 100.</div>
      <div class="bubble me">Ya tengo mi ticket.</div>
      <div class="bubble">Perfecto. Validado. Has ganado 40 puntos y una tirada en la Ruleta del 100.</div>
      <div class="bubble me">Quiero ver mi nivel.</div>
      <div class="bubble">Estas a 60 puntos de Fan Classico.</div>
    </div></div>`;
  }
  if (slide.layout === "ideas") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="grid cols-5">${slide.items.map((item, idx) => `
      <article class="idea"><div class="num">${String.fromCharCode(65 + idx)}</div><h3>${safe(item[0])}</h3><p class="body">${safe(item[1])}</p></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "matrix") {
    const heads = ["Objetivo", "Front / canal", "Core rules", "Validacion", "Output"];
    return `<div class="stack">${titleBlock(slide, true)}<div class="matrix">${heads.map((h) => `<div class="head">${h}</div>`).join("")}${slide.rows.map((row) => row.map((cell, idx) => `<div>${idx === 0 ? "<span class='dot'></span>" : ""}${safe(cell)}</div>`).join("")).join("")}</div></div>`;
  }
  if (slide.layout === "dashboard") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="dashboard">
      <div class="dashboard-grid">${slide.items.map((item) => `<div class="dash-card"><span class="meta">${safe(item[0])}</span><strong>${safe(item[1])}</strong></div>`).join("")}</div>
      <div class="spark"></div>
      <div class="bars">
        <div class="bar"><span>Madrid</span><i style="width:92%"></i></div>
        <div class="bar"><span>Levante</span><i style="width:74%"></i></div>
        <div class="bar"><span>Andalucia</span><i style="width:66%"></i></div>
      </div>
    </div></div>`;
  }
  if (slide.layout === "bars") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="bars">${slide.items.map((item) => `
      <div class="bar"><span>${safe(item[0])}</span><i style="width:${safe(item[1])}%"></i></div>`).join("")}</div></div>`;
  }
  if (slide.layout === "roadmap") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="roadmap">${slide.items.map((item) => `
      <article class="card"><div class="phase">${safe(item[0])}</div><h3>${safe(item[1])}</h3><p class="body">${safe(item[2])}</p></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "closing") {
    return `<div class="content split">${titleBlock(slide)}${renderCards(slide.items, 3)}</div>`;
  }
  return `<div class="stack">${titleBlock(slide, true)}${renderCards(slide.items, slide.cols || 3)}</div>`;
}

function render() {
  deck.innerHTML = slides.map((slide, i) => `
    <section class="slide ${slide.theme || ""}" id="slide-${i + 1}" data-index="${i}">
      <div class="slide-grid">
        ${header(slide, i)}
        ${layout(slide, i)}
        ${footer(slide)}
      </div>
    </section>`).join("");
}

function update(next) {
  current = Math.max(0, Math.min(slides.length - 1, next));
  document.querySelectorAll(".slide").forEach((section, i) => {
    section.classList.toggle("active", i === current);
    section.classList.toggle("before", i < current);
  });
  counter.textContent = `${String(current + 1).padStart(2, "0")} / ${slides.length}`;
  progress.style.width = `${((current + 1) / slides.length) * 100}%`;
  document.querySelectorAll("[data-jump]").forEach((button) => {
    button.classList.toggle("is-active", Number(button.dataset.jump) <= current);
  });
  history.replaceState(null, "", `#slide-${current + 1}`);
}

render();
update(current);

document.getElementById("next").addEventListener("click", () => update(current + 1));
document.getElementById("prev").addEventListener("click", () => update(current - 1));
document.getElementById("home").addEventListener("click", () => update(0));
document.querySelectorAll("[data-jump]").forEach((button) => button.addEventListener("click", () => update(Number(button.dataset.jump))));
deck.addEventListener("click", (event) => {
  if (event.target.closest("a, button")) return;
  update(current + 1);
});
window.addEventListener("keydown", (event) => {
  if (["ArrowRight", "PageDown", " "].includes(event.key)) update(current + 1);
  if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) update(current - 1);
  if (event.key === "Home") update(0);
  if (event.key === "End") update(slides.length - 1);
});
window.addEventListener("hashchange", () => {
  const index = Number(location.hash.replace("#slide-", "")) - 1;
  if (!Number.isNaN(index)) update(index);
});
</script>
</body>
</html>
