<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Dashboard realista del programa 100 Momentos Frigo">
  <defs>
    <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061416"/>
      <stop offset=".55" stop-color="#071b1e"/>
      <stop offset="1" stop-color="#000d10"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#142529" stop-opacity=".96"/>
      <stop offset="1" stop-color="#061113" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#bc7155"/>
      <stop offset="1" stop-color="#f0b28f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#5fb7c8"/>
      <stop offset="1" stop-color="#d7f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000d10" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="54" fill="url(#shell)"/>
  <rect x="34" y="34" width="1532" height="932" rx="44" fill="none" stroke="#ffffff" stroke-opacity=".14"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <g transform="translate(70 64)">
      <text x="0" y="40" fill="#ffffff" font-size="34" font-weight="800">100 Momentos Frigo</text>
      <text x="0" y="74" fill="#9aa3a7" font-size="19" font-weight="600">Live intelligence cockpit · verano 2027 · Espana</text>
    </g>
    <g transform="translate(1095 64)">
      <rect width="200" height="50" rx="25" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="24" y="32" fill="#ffffff" font-size="18" font-weight="700">Hoy · 14:30</text>
      <rect x="222" width="206" height="50" rx="25" fill="#bc7155"/>
      <text x="248" y="32" fill="#ffffff" font-size="18" font-weight="800">Campana activa</text>
    </g>

    <g transform="translate(70 150)" filter="url(#shadow)">
      <rect width="330" height="162" rx="30" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#9aa3a7" font-size="18" font-weight="700">Consumidores opt-in</text>
      <text x="30" y="112" fill="#ffffff" font-size="72" font-weight="900">48.2K</text>
      <path d="M245 105 C260 82 278 91 289 68 C298 50 316 54 330 34" fill="none" stroke="#bc7155" stroke-width="8" stroke-linecap="round"/>
      <text x="30" y="142" fill="#bc7155" font-size="17" font-weight="800">+18% vs. semana anterior</text>
    </g>

    <g transform="translate(428 150)" filter="url(#shadow)">
      <rect width="330" height="162" rx="30" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#9aa3a7" font-size="18" font-weight="700">Validaciones aprobadas</text>
      <text x="30" y="112" fill="#ffffff" font-size="72" font-weight="900">31.4K</text>
      <rect x="30" y="128" width="252" height="12" rx="6" fill="#ffffff" fill-opacity=".12"/>
      <rect x="30" y="128" width="211" height="12" rx="6" fill="url(#accent)"/>
    </g>

    <g transform="translate(786 150)" filter="url(#shadow)">
      <rect width="330" height="162" rx="30" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#9aa3a7" font-size="18" font-weight="700">Repeaters</text>
      <text x="30" y="112" fill="#ffffff" font-size="72" font-weight="900">18.6%</text>
      <text x="30" y="142" fill="#9aa3a7" font-size="17" font-weight="700">2+ momentos validados</text>
    </g>

    <g transform="translate(1144 150)" filter="url(#shadow)">
      <rect width="330" height="162" rx="30" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#9aa3a7" font-size="18" font-weight="700">Fraude bloqueado</text>
      <text x="30" y="112" fill="#ffffff" font-size="72" font-weight="900">2.1%</text>
      <text x="30" y="142" fill="#9aa3a7" font-size="17" font-weight="700">OCR + IA + reglas</text>
    </g>

    <g transform="translate(70 342)" filter="url(#shadow)">
      <rect width="690" height="332" rx="34" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#ffffff" font-size="25" font-weight="850">Embudo del programa</text>
      <text x="30" y="76" fill="#9aa3a7" font-size="16" font-weight="650">Del QR en cartel a fan activable</text>
      <g transform="translate(34 112)">
        <rect width="590" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/>
        <rect width="590" height="34" rx="17" fill="url(#accent)"/>
        <text x="20" y="23" fill="#ffffff" font-size="16" font-weight="800">QR / PLV escaneado · 91K</text>
        <rect y="60" width="488" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/>
        <rect y="60" width="488" height="34" rx="17" fill="#63b6c6"/>
        <text x="20" y="83" fill="#061416" font-size="16" font-weight="900">WhatsApp iniciado · 62K</text>
        <rect y="120" width="350" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/>
        <rect y="120" width="350" height="34" rx="17" fill="#ffffff"/>
        <text x="20" y="143" fill="#061416" font-size="16" font-weight="900">Ticket / selfie recibido · 39K</text>
        <rect y="180" width="302" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/>
        <rect y="180" width="302" height="34" rx="17" fill="#bc7155"/>
        <text x="20" y="203" fill="#ffffff" font-size="16" font-weight="800">Momento desbloqueado · 31K</text>
      </g>
    </g>

    <g transform="translate(790 342)" filter="url(#shadow)">
      <rect width="684" height="332" rx="34" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#ffffff" font-size="25" font-weight="850">Actividad por zona y canal</text>
      <text x="30" y="76" fill="#9aa3a7" font-size="16" font-weight="650">Decision diaria para premios, retos y pacing</text>
      <g transform="translate(38 112)">
        <path d="M74 160 C110 118 124 76 168 56 C216 34 242 64 270 100 C310 150 370 116 414 78 C460 38 520 48 578 28" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="66" stroke-linecap="round"/>
        <path d="M74 160 C110 118 124 76 168 56 C216 34 242 64 270 100 C310 150 370 116 414 78 C460 38 520 48 578 28" fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round"/>
        <circle cx="74" cy="160" r="20" fill="#bc7155"/><circle cx="270" cy="100" r="20" fill="#ffffff"/><circle cx="414" cy="78" r="20" fill="#63b6c6"/><circle cx="578" cy="28" r="20" fill="#bc7155"/>
        <g fill="#ffffff" font-size="17" font-weight="800">
          <text x="44" y="210">Madrid</text>
          <text x="224" y="152">Levante</text>
          <text x="365" y="130">Andalucia</text>
          <text x="512" y="82">Catalunya</text>
        </g>
      </g>
    </g>

    <g transform="translate(70 704)" filter="url(#shadow)">
      <rect width="480" height="210" rx="34" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#ffffff" font-size="24" font-weight="850">Mix de mecanicas</text>
      <g transform="translate(30 75)" font-size="16" font-weight="800">
        <text x="0" y="25" fill="#ffffff">Instant win</text>
        <rect x="150" y="8" width="260" height="20" rx="10" fill="#ffffff" fill-opacity=".10"/>
        <rect x="150" y="8" width="226" height="20" rx="10" fill="#bc7155"/>
        <text x="420" y="25" fill="#9aa3a7">52%</text>
        <text x="0" y="70" fill="#ffffff">Ticket OCR</text>
        <rect x="150" y="53" width="260" height="20" rx="10" fill="#ffffff" fill-opacity=".10"/>
        <rect x="150" y="53" width="162" height="20" rx="10" fill="#63b6c6"/>
        <text x="420" y="70" fill="#9aa3a7">37%</text>
        <text x="0" y="115" fill="#ffffff">Selfie proof</text>
        <rect x="150" y="98" width="260" height="20" rx="10" fill="#ffffff" fill-opacity=".10"/>
        <rect x="150" y="98" width="93" height="20" rx="10" fill="#ffffff"/>
        <text x="420" y="115" fill="#9aa3a7">21%</text>
      </g>
    </g>

    <g transform="translate(580 704)" filter="url(#shadow)">
      <rect width="420" height="210" rx="34" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#ffffff" font-size="24" font-weight="850">Next best action</text>
      <rect x="30" y="75" width="360" height="42" rx="21" fill="#bc7155"/>
      <text x="50" y="102" fill="#ffffff" font-size="17" font-weight="850">Subir premio Levante 18:00-21:00</text>
      <rect x="30" y="130" width="360" height="42" rx="21" fill="#ffffff" fill-opacity=".10"/>
      <text x="50" y="157" fill="#ffffff" font-size="17" font-weight="800">Activar reto Cornetto viernes</text>
    </g>

    <g transform="translate(1030 704)" filter="url(#shadow)">
      <rect width="444" height="210" rx="34" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="46" fill="#ffffff" font-size="24" font-weight="850">Ultimas validaciones</text>
      <g font-size="16" font-weight="750">
        <text x="30" y="86" fill="#9aa3a7">14:21</text><text x="112" y="86" fill="#ffffff">Madrid · Cornetto · OCR OK</text>
        <text x="30" y="124" fill="#9aa3a7">14:19</text><text x="112" y="124" fill="#ffffff">Malaga · Cartel QR · +40 pts</text>
        <text x="30" y="162" fill="#9aa3a7">14:16</text><text x="112" y="162" fill="#ffffff">Valencia · Selfie proof · review</text>
      </g>
    </g>
  </g>
</svg>
