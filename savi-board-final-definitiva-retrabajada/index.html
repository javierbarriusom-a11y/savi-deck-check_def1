<style>
/* ============================================
   SAVI — Customer Engagement Solutions Deck
   Editorial-minimal, type-driven, agency vibe
   ============================================ */

:root {
  --bg: #f4f1ea;
  --bg-2: #ece8de;
  --ink: #1a1a1a;
  --ink-soft: #4a4a48;
  --ink-mute: #8a8780;
  --line: #1a1a1a;
  --line-soft: #d4cfc1;
  --accent: #ff4d1f;        /* signal orange */
  --accent-2: #1a1a1a;
  --paper: #fafaf7;
  --invert-bg: #0e0e0c;
  --invert-ink: #f4f1ea;

  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --pad-x: 80px;
  --pad-y: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #000;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

deck-stage > section {
  width: 1920px;
  height: 1080px;
  background: var(--bg);
  color: var(--ink);
  position: relative;
  overflow: hidden;
  font-family: var(--sans);
  font-size: 18px;
  line-height: 1.4;
  letter-spacing: -0.005em;
}

/* ---------- Type scale ---------- */
.display {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 220px;
  line-height: 0.92;
  letter-spacing: -0.025em;
  text-wrap: pretty;
}
.display.s {
  font-size: 144px;
}
.display.xs {
  font-size: 96px;
}
.h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 110px;
  line-height: 0.96;
  letter-spacing: -0.022em;
  text-wrap: balance;
}
.h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 76px;
  line-height: 1;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.h3 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 52px;
  line-height: 1.05;
  letter-spacing: -0.015em;
}
.h4 {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 30px;
  line-height: 1.15;
  letter-spacing: -0.012em;
}
.body-l { font-size: 28px; line-height: 1.45; color: var(--ink-soft); text-wrap: pretty; }
.body { font-size: 24px; line-height: 1.5; color: var(--ink-soft); text-wrap: pretty; }
.body-s { font-size: 22px; line-height: 1.5; color: var(--ink-soft); }

.eyebrow, .label, .meta {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.eyebrow.lg { font-size: 26px; }
.eyebrow .dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 12px;
  transform: translateY(-2px);
}

/* ---------- Layout primitives ---------- */
.frame {
  position: absolute;
  inset: 0;
  padding: var(--pad-y) var(--pad-x);
  display: flex;
  flex-direction: column;
}
.frame.justify-between { justify-content: space-between; }
.frame.center { justify-content: center; }

.row { display: flex; gap: 32px; }
.col { display: flex; flex-direction: column; gap: 16px; }
.between { justify-content: space-between; }
.ai-end { align-items: flex-end; }
.ai-center { align-items: center; }
.flex1 { flex: 1; min-width: 0; }
.grow { flex: 1; }

.divider {
  height: 1px;
  background: var(--line);
  width: 100%;
}
.divider.soft { background: var(--line-soft); }

.rule-top { border-top: 1px solid var(--line); padding-top: 24px; }
.rule-top.soft { border-top: 1px solid var(--line-soft); }

/* ---------- Header / footer chrome ---------- */
.deck-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.deck-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  margin-top: auto;
}
.wordmark {
  font-family: var(--serif);
  font-size: 32px;
  letter-spacing: -0.02em;
}
.wordmark .dot { color: var(--accent); }

/* ---------- Inverted slides ---------- */
.invert { background: var(--invert-bg) !important; color: var(--invert-ink); }
.invert .body-l, .invert .body, .invert .body-s, .invert .eyebrow, .invert .label, .invert .meta { color: rgba(244,241,234,0.65); }
.invert .deck-header, .invert .deck-footer { border-color: rgba(244,241,234,0.18); }
.invert .divider { background: rgba(244,241,234,0.18); }
.invert .divider.soft { background: rgba(244,241,234,0.12); }
.invert .rule-top { border-top-color: rgba(244,241,234,0.18); }
.invert .rule-top.soft { border-top-color: rgba(244,241,234,0.12); }

/* ---------- Pills, tags ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 22px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
}
.pill.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.invert .pill { border-color: rgba(244,241,234,0.3); color: var(--invert-ink); }
.invert .pill.solid { background: var(--invert-ink); color: var(--invert-bg); border-color: var(--invert-ink); }

.tag {
  display: inline-block;
  padding: 6px 12px;
  background: rgba(26,26,26,0.06);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 22px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.invert .tag { background: rgba(244,241,234,0.1); color: rgba(244,241,234,0.7); }

/* ---------- Cards ---------- */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
}
.card.no-border { border: none; }
.card.soft { background: var(--bg-2); border: none; }
.card.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card.dark .body, .card.dark .body-s, .card.dark .label, .card.dark .meta { color: rgba(244,241,234,0.7); }
.card.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.card.accent .body, .card.accent .body-s, .card.accent .label, .card.accent .meta { color: rgba(255,255,255,0.85); }

/* ---------- Stat / number ---------- */
.stat-num {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 180px;
  line-height: 0.85;
  letter-spacing: -0.04em;
}
.stat-num.s { font-size: 120px; }

/* ---------- Index dot ---------- */
.idx {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  color: var(--ink-mute);
}

/* ---------- Marquee ---------- */
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.marquee {
  overflow: hidden;
  white-space: nowrap;
}
.marquee-track {
  display: inline-flex;
  animation: marquee 40s linear infinite;
  gap: 80px;
  padding-right: 80px;
}

/* ---------- Phone mockup (slide-scale, 1920×1080) ---------- */
.phone {
  width: 600px;
  height: 1240px;
  background: #111;
  border-radius: 70px;
  padding: 18px;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.5);
  position: relative;
}
.phone-screen {
  width: 100%;
  height: 100%;
  background: #ECE5DD;
  border-radius: 56px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.phone-notch {
  position: absolute;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  width: 180px; height: 44px;
  background: #000;
  border-radius: 22px;
  z-index: 10;
}

/* ---------- WhatsApp specific ---------- */
.wa-header {
  background: #075E54;
  color: #fff;
  padding: 70px 24px 20px;
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 24px;
}
.wa-avatar {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-weight: 600;
  color: #fff;
  font-size: 28px;
}
.wa-body {
  flex: 1;
  background:
    radial-gradient(circle at 30% 20%, rgba(0,0,0,0.04) 0 1px, transparent 1px),
    #ECE5DD;
  background-size: 24px 24px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
}
.wa-msg {
  max-width: 78%;
  background: #fff;
  border-radius: 12px 12px 12px 0;
  padding: 16px 18px;
  font-size: 24px;
  line-height: 1.35;
  color: #111;
  box-shadow: 0 1px 0.5px rgba(0,0,0,0.08);
}
.wa-msg.mine {
  align-self: flex-end;
  background: #DCF8C6;
  border-radius: 12px 12px 0 12px;
}
.wa-msg .ts {
  font-size: 22px;
  color: #888;
  margin-top: 6px;
  text-align: right;
}
.wa-msg .btn {
  display: block;
  margin-top: 12px;
  padding: 12px 16px;
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  text-align: center;
  color: #075E54;
  font-weight: 600;
  font-size: 24px;
}
.wa-msg .heading {
  font-weight: 600;
  font-size: 24px;
  margin-bottom: 6px;
}
.wa-input {
  background: #f0f0f0;
  padding: 14px 22px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.wa-input .input-bubble {
  flex: 1;
  background: #fff;
  border-radius: 24px;
  padding: 12px 20px;
  font-size: 24px;
  color: #888;
}

/* ---------- Slide number / chrome ---------- */
.slide-num {
  font-family: var(--mono);
  font-size: 24px;
  letter-spacing: 0.08em;
}

/* ---------- Misc ---------- */
.accent-text { color: var(--accent); }
.serif { font-family: var(--serif); }
.mono { font-family: var(--mono); }
.tabular { font-variant-numeric: tabular-nums; }

.underline-title {
  display: inline-block;
  padding-bottom: 6px;
  border-bottom: 2px solid currentColor;
}

/* Faux brand logos */
.brand-logo {
  font-family: var(--serif);
  font-size: 38px;
  letter-spacing: -0.02em;
  color: var(--ink);
  opacity: 0.85;
  white-space: nowrap;
}
.invert .brand-logo { color: var(--invert-ink); }

.brand-logo.sans {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.brand-logo.mono {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 22px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* ---------- Animated dot ---------- */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
.live-dot {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.6s ease-in-out infinite;
  margin-right: 8px;
  vertical-align: middle;
}

/* ---------- Grid tiles helper ---------- */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }

/* ---------- Asymmetric layouts ---------- */
.split-7-5 {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 56px;
  height: 100%;
}
.split-5-7 {
  display: grid;
  grid-template-columns: 5fr 7fr;
  gap: 56px;
  height: 100%;
}

/* ---------- Big bracket ---------- */
.bracket {
  position: relative;
  padding: 0 24px;
}
.bracket::before, .bracket::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 12px;
  border: 2px solid currentColor;
}
.bracket::before { left: 0; border-right: none; }
.bracket::after { right: 0; border-left: none; }

/* ---------- Hover lift ---------- */
.lift { transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
.lift:hover { transform: translateY(-4px); }

/* product chip */
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-family: var(--mono);
  font-size: 22px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 12px;
  border: 1px solid currentColor;
  opacity: 0.7;
}

/* dashboard mockup */
.dash {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 24px;
  font-family: var(--sans);
}
.dash-bar {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 100px;
}
.dash-bar > div {
  flex: 1;
  background: var(--ink);
  position: relative;
}
.dash-bar > div.hi { background: var(--accent); }

/* sparkline */
svg.spark { display: block; width: 100%; height: 60px; }

</style>
<style>
/* ============================================
   SAVI LANDING — corporate teal theme overrides
   Layered ON TOP of styles.css to repaint the
   slide components as scrollable landing sections.
   ============================================ */

:root {
  /* Savi corporate palette */
  --bg: #f4f1ea;
  --bg-2: #ece8de;
  --paper: #ffffff;
  --ink: #0a2e2b;
  --ink-soft: #2d4f4b;
  --ink-mute: #6b8884;
  --line: #0a2e2b;
  --line-soft: #c5d3d0;
  --accent: #5dd4c1;       /* turquoise */
  --accent-deep: #0a4f47;  /* deep teal */
  --accent-mid: #1a6b63;
  --accent-2: #0a2e2b;
  --invert-bg: #0a2e2b;
  --invert-ink: #f4f1ea;

  /* Fonts: editorial serif display + corporate sans body */
  --display: "Instrument Serif", "Times New Roman", serif;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  scroll-behavior: smooth;
  overflow-x: hidden;
}

/* ===== Reset deck-stage to landing flow ===== */
deck-stage {
  display: block !important;
  position: static !important;
  width: 100% !important;
  height: auto !important;
  background: var(--bg) !important;
  transform: none !important;
}
deck-stage::part(slide-counter),
.slide-counter,
[class*="counter"] {
  display: none !important;
}

/* Each section is now a viewport-height block */
deck-stage > section {
  width: 100vw !important;
  min-width: 100vw !important;
  max-width: 100vw !important;
  height: auto !important;
  min-height: max(100vh, 720px) !important;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 18px;
  position: relative;
  overflow: hidden;
  display: block;
  scroll-snap-align: start;
}

/* Inner frame becomes flow content with max-width */
deck-stage > section .frame {
  position: relative !important;
  inset: auto !important;
  width: min(1680px, 92vw);
  max-width: 100%;
  margin: 0 auto;
  padding: clamp(56px, 7vh, 96px) clamp(32px, 4vw, 80px);
  min-height: max(100vh, 720px);
  display: flex;
  flex-direction: column;
}

/* ===== Type system: corporate sans, big & confident ===== */
.display, .h1, .h2, .h3 {
  font-family: var(--serif) !important;
}
.display {
  font-weight: 400 !important;
  font-size: clamp(72px, 10vw, 180px) !important;
  line-height: 0.94 !important;
  letter-spacing: -0.025em !important;
}
.display.s {
  font-size: clamp(56px, 7vw, 120px) !important;
}
.display.xs {
  font-size: clamp(44px, 5.5vw, 88px) !important;
}
.h1 {
  font-weight: 400 !important;
  font-size: clamp(48px, 6vw, 96px) !important;
  line-height: 1.0 !important;
  letter-spacing: -0.022em !important;
}
.h2 {
  font-weight: 400 !important;
  font-size: clamp(36px, 4.5vw, 68px) !important;
  line-height: 1.04 !important;
  letter-spacing: -0.02em !important;
}
.h3 {
  font-weight: 400 !important;
  font-size: clamp(28px, 3vw, 46px) !important;
  line-height: 1.08 !important;
  letter-spacing: -0.015em !important;
}
.h4 {
  font-family: var(--sans);
  font-weight: 600;
  font-size: clamp(20px, 1.6vw, 28px);
  line-height: 1.2;
  letter-spacing: -0.015em;
}
.body-l { font-size: clamp(18px, 1.5vw, 24px); line-height: 1.5; color: var(--ink-soft); }
.body { font-size: clamp(16px, 1.2vw, 20px); line-height: 1.55; color: var(--ink-soft); }
.body-s { font-size: clamp(14px, 1vw, 17px); line-height: 1.55; color: var(--ink-soft); }

.eyebrow, .label, .meta {
  font-family: var(--mono);
  font-size: clamp(11px, 0.85vw, 14px) !important;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-deep);
}
.eyebrow .dot {
  background: var(--accent) !important;
  width: 10px !important;
  height: 10px !important;
}

/* The wordmark */
.wordmark {
  font-family: var(--serif) !important;
  font-weight: 400;
  font-size: clamp(24px, 1.9vw, 32px) !important;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.wordmark .dot {
  color: var(--accent);
}

/* Inverted sections — teal dark */
.invert {
  background: var(--accent-deep) !important;
  color: #f4f1ea !important;
}
.invert .body-l, .invert .body, .invert .body-s {
  color: rgba(244,241,234,0.78) !important;
}
.invert .eyebrow, .invert .label, .invert .meta {
  color: var(--accent) !important;
}
.invert .deck-header, .invert .deck-footer {
  border-color: rgba(244,241,234,0.18) !important;
}
.invert .divider { background: rgba(244,241,234,0.2) !important; }
.invert .divider.soft { background: rgba(244,241,234,0.12) !important; }

/* Cards: clean white with thin teal border */
.card {
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
}
.card.soft { background: var(--bg-2); border-color: transparent; }
.card.dark { background: var(--accent-deep); color: #f4f1ea; border-color: var(--accent-deep); }
.card.accent { background: var(--accent); color: var(--accent-deep); border-color: var(--accent); }
.card.accent .body, .card.accent .body-s, .card.accent .label, .card.accent .meta { color: var(--accent-deep); }

/* Pills */
.pill {
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: clamp(11px, 0.85vw, 14px);
  padding: 8px 16px;
}
.pill.solid { background: var(--ink); color: var(--bg); }
.pill.accent { background: var(--accent); color: var(--accent-deep); border-color: var(--accent); }

.tag {
  font-size: clamp(10px, 0.75vw, 13px);
  background: rgba(10,46,43,0.06);
  color: var(--ink-soft);
}

/* Stat numbers — serif editorial */
.stat-num {
  font-family: var(--serif) !important;
  font-weight: 400 !important;
  font-size: clamp(72px, 10vw, 160px) !important;
  letter-spacing: -0.04em !important;
  line-height: 0.85 !important;
  font-variant-numeric: tabular-nums;
}
.stat-num.s {
  font-size: clamp(56px, 7vw, 110px) !important;
}

/* Brand logos — sans */
.brand-logo {
  font-family: var(--sans) !important;
  font-weight: 600 !important;
  font-size: clamp(20px, 1.6vw, 30px) !important;
  letter-spacing: -0.02em !important;
}

/* ===== Interactive slide transitions ===== */
deck-stage > section.slide-fx {
  --parallax-x: 0;
  --parallax-y: 0;
  --slide-tilt: 0deg;
  perspective: 1200px;
}

deck-stage > section.slide-fx .frame {
  opacity: 1;
  filter: none;
  transform-origin: 50% 50%;
  transition:
    opacity 900ms cubic-bezier(0.2, 0.8, 0.2, 1),
    filter 900ms cubic-bezier(0.2, 0.8, 0.2, 1),
    transform 980ms cubic-bezier(0.16, 1, 0.3, 1),
    clip-path 980ms cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, opacity, filter, clip-path;
}

deck-stage > section.fx-push .frame {
  transform: translate3d(0, 92px, 0) scale(0.96);
}

deck-stage > section.fx-swipe .frame {
  clip-path: inset(0 34% 0 0);
  transform: translate3d(-7vw, 0, 0);
}

deck-stage > section.fx-zoom .frame {
  transform: scale(0.86);
}

deck-stage > section.fx-tilt .frame {
  transform: rotateX(8deg) rotateZ(-2deg) translate3d(0, 70px, 0);
}

deck-stage > section.fx-reveal .frame {
  clip-path: inset(18% 0 18% 0);
  transform: translate3d(0, -56px, 0);
}

deck-stage > section.fx-cards .frame {
  transform: translate3d(5vw, 42px, 0) scale(0.98);
}

deck-stage > section.slide-active .frame {
  opacity: 1;
  filter: blur(0) saturate(1);
  clip-path: inset(0 0 0 0);
  transform:
    translate3d(calc(var(--parallax-x) * 5px), calc(var(--parallax-y) * 5px), 0)
    rotateZ(var(--slide-tilt))
    scale(1);
}

deck-stage > section.slide-before .frame {
  opacity: 1;
  filter: none;
  transform: translate3d(0, -34px, 0) scale(0.985);
}

deck-stage > section.slide-fx:not(.slide-active):not(.slide-before) .frame {
  opacity: 1;
  filter: none;
}

deck-stage > section.slide-active .display,
deck-stage > section.slide-active .h1,
deck-stage > section.slide-active .h2 {
  transform: translate3d(calc(var(--parallax-x) * -10px), calc(var(--parallax-y) * -7px), 0);
  transition: transform 240ms ease-out;
}

deck-stage > section.slide-active .card,
deck-stage > section.slide-active .phone,
deck-stage > section.slide-active .dash,
deck-stage > section.slide-active .pill {
  transform: translate3d(calc(var(--parallax-x) * 8px), calc(var(--parallax-y) * 6px), 0);
  transition:
    transform 260ms ease-out,
    box-shadow 260ms ease-out;
}

deck-stage > section.slide-active.fx-cards .card:nth-child(odd),
deck-stage > section.slide-active.fx-cards .tag:nth-child(odd),
deck-stage > section.slide-active.fx-cards .pill:nth-child(odd) {
  animation: pop-card 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

deck-stage > section.slide-active.fx-cards .card:nth-child(even),
deck-stage > section.slide-active.fx-cards .tag:nth-child(even),
deck-stage > section.slide-active.fx-cards .pill:nth-child(even) {
  animation: pop-card-alt 780ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

deck-stage > section.slide-active.fx-swipe .divider,
deck-stage > section.slide-active.fx-swipe .deck-header,
deck-stage > section.slide-active.fx-swipe .deck-footer,
deck-stage > section.slide-active.fx-reveal .divider,
deck-stage > section.slide-active.fx-reveal .deck-header,
deck-stage > section.slide-active.fx-reveal .deck-footer {
  animation: draw-line 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  transform-origin: left center;
}

deck-stage > section.slide-active .live-dot,
deck-stage > section.slide-active .eyebrow .dot {
  animation: dot-snap 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes pop-card {
  from { opacity: 0; transform: translate3d(-28px, 32px, 0) rotate(-1.5deg); }
  to { opacity: 1; transform: translate3d(calc(var(--parallax-x) * 8px), calc(var(--parallax-y) * 6px), 0) rotate(0); }
}

@keyframes pop-card-alt {
  from { opacity: 0; transform: translate3d(28px, 42px, 0) rotate(1.5deg); }
  to { opacity: 1; transform: translate3d(calc(var(--parallax-x) * 8px), calc(var(--parallax-y) * 6px), 0) rotate(0); }
}

@keyframes draw-line {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

@keyframes dot-snap {
  0% { transform: scale(0.1); }
  45% { transform: scale(1.8); }
  100% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  deck-stage > section.slide-fx .frame,
  deck-stage > section.slide-active .display,
  deck-stage > section.slide-active .h1,
  deck-stage > section.slide-active .h2,
  deck-stage > section.slide-active .card,
  deck-stage > section.slide-active .phone,
  deck-stage > section.slide-active .dash,
  deck-stage > section.slide-active .pill {
    animation: none !important;
    transition: none !important;
    transform: none !important;
    clip-path: none !important;
    filter: none !important;
    opacity: 1 !important;
  }
}

/* ===== Click navigation presentation mode ===== */
html,
body {
  height: 100%;
  overflow: hidden;
  scroll-behavior: auto;
}

body.click-navigation-mode {
  background: #000;
}

body.click-navigation-mode deck-stage {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  overflow: hidden !important;
  background: #000 !important;
}

body.click-navigation-mode deck-stage > section {
  position: absolute !important;
  inset: 0 !important;
  width: 100vw !important;
  min-width: 100vw !important;
  max-width: 100vw !important;
  height: 100vh !important;
  min-height: 100vh !important;
  overflow: hidden !important;
  opacity: 0;
  pointer-events: none;
  z-index: 0;
  transform: translate3d(9vw, 0, 0) scale(0.965);
  transition:
    opacity 680ms cubic-bezier(0.2, 0.8, 0.2, 1),
    transform 820ms cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity, transform;
  scroll-snap-align: none;
}

body.click-navigation-mode deck-stage > section.slide-before {
  transform: translate3d(-9vw, 0, 0) scale(0.965);
}

body.click-navigation-mode deck-stage > section.slide-active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
  transform: translate3d(0, 0, 0) scale(1);
}

body.click-navigation-mode deck-stage > section .frame {
  min-height: 100vh !important;
}

body.click-navigation-mode deck-stage > section.slide-fx .frame,
body.click-navigation-mode deck-stage > section.fx-push .frame,
body.click-navigation-mode deck-stage > section.fx-swipe .frame,
body.click-navigation-mode deck-stage > section.fx-zoom .frame,
body.click-navigation-mode deck-stage > section.fx-tilt .frame,
body.click-navigation-mode deck-stage > section.fx-reveal .frame,
body.click-navigation-mode deck-stage > section.fx-cards .frame {
  opacity: 1;
  filter: none;
  clip-path: inset(0 0 0 0);
  transform: none;
}

body.click-navigation-mode deck-stage > section.slide-active .frame {
  transform:
    translate3d(calc(var(--parallax-x) * 5px), calc(var(--parallax-y) * 5px), 0)
    rotateZ(var(--slide-tilt))
    scale(1);
}

body.click-navigation-mode .top-progress {
  transition: transform 280ms ease;
}

body.click-navigation-mode .side-nav {
  display: none !important;
}

body.click-navigation-mode .click-controls {
  position: fixed;
  right: clamp(18px, 2vw, 34px);
  bottom: clamp(16px, 2vh, 30px);
  z-index: 120;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  background: rgba(244, 241, 234, 0.9);
  border: 1px solid rgba(10, 46, 43, 0.42);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
  backdrop-filter: blur(14px) saturate(1.1);
}

.click-controls {
  display: none;
}

.click-controls button,
.click-controls .click-count {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.click-controls button {
  border: 1px solid rgba(10, 46, 43, 0.28);
  background: transparent;
  color: var(--ink);
  min-height: 36px;
  padding: 9px 12px;
  cursor: pointer;
}

.click-controls button:hover:not(:disabled),
.click-controls button:focus-visible {
  background: var(--ink);
  color: var(--bg);
  outline: none;
}

.click-controls button:disabled {
  opacity: 0.32;
  cursor: default;
}

.click-controls .click-next {

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

/* ─── Mount helpers ────────────────────────────────────────────────────── */
const SLIDE_FX_CLASSES = ["fx-push", "fx-swipe", "fx-zoom", "fx-tilt", "fx-reveal", "fx-cards"];

// Move rendered content from the off-screen temp div into the placeholder section.
function transferContent(tmp, placeholder) {
  const rendered = tmp.querySelector("section");
  if (!rendered) return false;

  // Copy className and screen label from the rendered section
  if (rendered.className) placeholder.className = rendered.className;
  const label = rendered.getAttribute("data-screen-label");
  if (label) placeholder.setAttribute("data-screen-label", label);

  const slideNumber = Number((placeholder.id || "").replace("m", "")) || 1;
  placeholder.classList.add("slide-fx", SLIDE_FX_CLASSES[(slideNumber - 1) % SLIDE_FX_CLASSES.length]);

  // Move children
  placeholder.innerHTML = "";
  while (rendered.firstChild) placeholder.appendChild(rendered.firstChild);

  // Mark the inner frame for staggered reveal-on-scroll
  const frame = placeholder.querySelector(".frame");
  if (frame) frame.classList.add("reveal-stagger");

  return true;
}

let mountedCount = 0;

function afterMount() {
  mountedCount++;
  if (mountedCount === slideMap.length) {
    setupReveals();
    setupSlideInteractions();
    setupAutoplayPreviews();
    setupSideNav();
    setupProgress();
    setupClickControls();
    setupI18n();
    requestAnimationFrame(() => scrollToDeckHash("auto"));
  }
}

function mountAllSlides() {
  slideMap.forEach((entry) => {
    const placeholder = document.getElementById("m" + entry.id);
    if (!placeholder) return;

    // Render into a hidden off-screen div (width matches design coords so
    // relative units inside slide components resolve correctly)
    const tmp = document.createElement("div");
    tmp.style.cssText =
      "position:absolute;left:-99999px;top:0;" +
      "width:1920px;height:1080px;visibility:hidden;pointer-events:none";
    document.body.appendChild(tmp);

    const root = ReactDOM.createRoot(tmp);
    root.render(<entry.Comp />);

    // Poll until React has committed — setTimeout is used (not rAF) so it
    // fires even when the page is in a background/hidden iframe.
    let attempts = 0;
    function tryTransfer() {
      if (transferContent(tmp, placeholder)) {
        tmp.remove();
        afterMount();
        return;
      }
      if (attempts++ < 80) {
        setTimeout(tryTransfer, 16);
      } else {
        console.warn("[savi] mount timeout for #m" + entry.id);
        tmp.remove();
        afterMount();
      }
    }
    setTimeout(tryTransfer, 16);
  });
}

/* ─── Scroll-reveal ────────────────────────────────────────────────────── */
function setupReveals() {
  const sections = Array.from(document.querySelectorAll("deck-stage > section"));
  document.body.classList.add("click-navigation-mode");

  function showSection(s) {
    s.classList.add("in");
    const frame = s.querySelector(".reveal-stagger");
    if (frame) frame.classList.add("in");
  }

  sections.forEach(showSection);
}

/* ─── Varied slide transitions + pointer response ─────────────────────── */
function setupSlideInteractions() {
  const sections = Array.from(document.querySelectorAll("deck-stage > section"));
  if (!sections.length) return;

  let activeIndex = -1;

  function getHashIndex() {
    const hash = location.hash.slice(1);
    if (!hash) return 0;
    const escapedHash = window.CSS && CSS.escape ? CSS.escape(hash) : hash;
    const target =
      document.querySelector(`[data-anchor="${escapedHash}"]`) ||
      document.getElementById(hash);
    const index = sections.indexOf(target);
    return index >= 0 ? index : 0;
  }

  function setActive(index, options = {}) {
    if (index === activeIndex || index < 0) return;
    activeIndex = Math.min(index, sections.length - 1);

    sections.forEach((section, i) => {
      section.classList.toggle("slide-active", i === activeIndex);
      section.classList.toggle("slide-before", i < activeIndex);
      if (i !== activeIndex) {
        section.style.setProperty("--parallax-x", "0");
        section.style.setProperty("--parallax-y", "0");
        section.style.setProperty("--slide-tilt", "0deg");
      }
    });

    const activeSection = sections[activeIndex];
    if (activeSection && options.updateHash !== false) {
      const anchor = activeSection.getAttribute("data-anchor") || activeSection.id;
      if (anchor && location.hash.slice(1) !== anchor) {
        history.replaceState(null, "", `#${anchor}`);
      }
    }

    window.dispatchEvent(new CustomEvent("savi:slidechange", {
      detail: { index: activeIndex, total: sections.length, section: activeSection }
    }));

    if (activeSection && options.preserveScroll !== true) {
      activeSection.scrollTo({ top: 0, left: 0, behavior: "auto" });
    }
  }

  function goTo(index, options = {}) {
    setActive(Math.max(0, Math.min(index, sections.length - 1)), options);
  }

  function next() {
    goTo(activeIndex + 1);
  }

  function prev() {
    goTo(activeIndex - 1);
  }

  window.SaviDeckNavigation = {
    goTo,
    next,
    prev,
    get activeIndex() { return activeIndex; },
    total: sections.length,
    sections
  };

  goTo(getHashIndex(), { updateHash: false });

  document.addEventListener("click", (event) => {
    const interactive = event.target.closest(
      "a, button, input, textarea, select, label, video, .top-nav, .side-nav, .language-picker, .global-language-picker, .twk-root, .macbook-video"
    );
    if (interactive) return;
    next();
  });

  document.addEventListener("keydown", (event) => {
    const tag = event.target && event.target.tagName;
    if (tag && /INPUT|TEXTAREA|SELECT/.test(tag)) return;

    if (["ArrowRight", "PageDown", "Space", "Enter"].includes(event.code)) {
      event.preventDefault();
      next();
    } else if (["ArrowLeft", "PageUp", "Backspace"].includes(event.code)) {
      event.preventDefault();
      prev();
    } else if (event.code === "Home") {
      event.preventDefault();
      goTo(0);
    } else if (event.code === "End") {
      event.preventDefault();
      goTo(sections.length - 1);
    }
  });

  window.addEventListener("hashchange", () => {
    goTo(getHashIndex(), { updateHash: false });
  });

  window.addEventListener("resize", () => {
    window.dispatchEvent(new CustomEvent("savi:slidechange", {
      detail: { index: activeIndex, total: sections.length, section: sections[activeIndex] }
    }));
  });

  // Pointer-based parallax intentionally disabled: the only motion in the deck
  // should be the transition between slides.
}

/* ─── Active slide video previews ─────────────────────────────────────── */
function setupAutoplayPreviews() {
  function playActiveVideos(section) {
    if (!section) return;

    section.querySelectorAll("video[data-autoplay-preview]").forEach((video) => {
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.removeAttribute("data-play-blocked");

      const attempt = video.play();
      if (attempt && typeof attempt.catch === "function") {
        attempt.catch(() => {
          video.setAttribute("data-play-blocked", "true");
        });
      }
    });
  }

  function pauseInactiveVideos(activeSection) {
    document.querySelectorAll("deck-stage > section video[data-autoplay-preview]").forEach((video) => {
      if (activeSection && activeSection.contains(video)) return;
      video.pause();
    });
  }

  window.addEventListener("savi:slidechange", (event) => {
    const section = event && event.detail ? event.detail.section : null;
    pauseInactiveVideos(section);
    playActiveVideos(section);
  });

  requestAnimationFrame(() => {
    const activeSection = document.querySelector("deck-stage > section.slide-active");
    pauseInactiveVideos(activeSection);
    playActiveVideos(activeSection);
  });
}

/* ─── Side nav ─────────────────────────────────────────────────────────── */
function setupSideNav() {
  const nav = document.getElementById("sideNav");
  if (!nav) return;

  const sections = Array.from(document.querySelectorAll("deck-stage > section"));

  sections.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.type = "button";

    const tip = document.createElement("span");
    tip.className = "tip";
    tip.textContent = s.getAttribute("data-screen-label") || String(i + 1);
    btn.appendChild(tip);

    btn.addEventListener("click", () => {
      if (window.SaviDeckNavigation) {
        window.SaviDeckNavigation.goTo(i);
      }
    });
    nav.appendChild(btn);
  });

  const buttons = Array.from(nav.querySelectorAll("button"));
  function updateActive(event) {
    const idx = event && event.detail ? event.detail.index : 0;
    buttons.forEach((b, i) => b.classList.toggle("active", i === idx));
  }

  window.addEventListener("savi:slidechange", updateActive);
  updateActive({ detail: { index: window.SaviDeckNavigation ? window.SaviDeckNavigation.activeIndex : 0 } });
}

/* ─── Top nav + progress bar ───────────────────────────────────────────── */
function setupProgress() {
  const bar = document.getElementById("topProgress");
  const nav = document.getElementById("topNav");

  function updateProgress(event) {
    const detail = event && event.detail ? event.detail : { index: 0, total: 1 };
    const pct = detail.total > 1 ? (detail.index + 1) / detail.total : 1;
    if (bar) bar.style.transform = `scaleX(${pct})`;
    if (nav) nav.classList.add("scrolled");
  }

  window.addEventListener("savi:slidechange", updateProgress);
  updateProgress({
    detail: {
      index: window.SaviDeckNavigation ? window.SaviDeckNavigation.activeIndex : 0,
      total: window.SaviDeckNavigation ? window.SaviDeckNavigation.total : 1
    }
  });
}

/* ─── Click presentation controls ──────────────────────────────────────── */
function setupClickControls() {
  const controls = document.getElementById("clickControls");
  if (!controls || !window.SaviDeckNavigation) return;

  const count = document.getElementById("clickCount");
  const home = controls.querySelector("[data-click-action='home']");
  const prev = controls.querySelector("[data-click-action='prev']");
  const next = controls.querySelector("[data-click-action='next']");

  controls.addEventListener("click", (event) => {
    const button = event.target.closest("[data-click-action]");
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();

    const action = button.getAttribute("data-click-action");
    if (action === "home") {
      window.SaviDeckNavigation.goTo(0);
    } else if (action === "prev") {
      window.SaviDeckNavigation.prev();
    } else if (action === "next") {
      window.SaviDeckNavigation.next();
    }
  });

  function updateControls(event) {
    const detail = event && event.detail
      ? event.detail
      : {
          index: window.SaviDeckNavigation.activeIndex,
          total: window.SaviDeckNavigation.total
        };

    const index = Math.max(0, detail.index);
    const total = Math.max(1, detail.total);
    if (count) {
      count.textContent = `${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
    }
    if (home) home.disabled = index === 0;
    if (prev) prev.disabled = index === 0;
    if (next) next.disabled = index >= total - 1;
  }

  window.addEventListener("savi:slidechange", updateControls);
  updateControls();
}

/* ─── Anchor link smooth scroll ─────────────────────────────────────────── */
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener("click", e => {
    const hash = a.getAttribute("href").slice(1);
    if (!hash) return;
    const target =
      document.querySelector(`[data-anchor="${hash}"]`) ||
      document.getElementById(hash);
    if (target) {
      e.preventDefault();
      const sections = Array.from(document.querySelectorAll("deck-stage > section"));
      const index = sections.indexOf(target);
      if (window.SaviDeckNavigation && index >= 0) {
        window.SaviDeckNavigation.goTo(index);
      }
    }
  });
});

function scrollToDeckHash(behavior = "smooth") {
  const hash = location.hash.slice(1);
  if (!hash) return;

  const escapedHash = window.CSS && CSS.escape ? CSS.escape(hash) : hash;
  const target =
    document.querySelector(`[data-anchor="${escapedHash}"]`) ||
    document.getElementById(hash);

  if (target && window.SaviDeckNavigation) {
    const sections = Array.from(document.querySelectorAll("deck-stage > section"));
    const index = sections.indexOf(target);
    if (index >= 0) window.SaviDeckNavigation.goTo(index, { updateHash: false });
  }
}

window.addEventListener("hashchange", () => {
  scrollToDeckHash("smooth");
});

const SAVI_AVAILABLE_LANGS = new Set(["es", "en", "de", "it"]);

const SAVI_TEXT_NODE_ORIGINALS = new WeakMap();

function translateTextNode(node, lang) {
  if (!SAVI_TEXT_NODE_ORIGINALS.has(node)) {
    SAVI_TEXT_NODE_ORIGINALS.set(node, node.nodeValue);
  }

  const original = SAVI_TEXT_NODE_ORIGINALS.get(node);
  if (lang === "es") {
    node.nodeValue = original;
    return;
  }

  const match = original.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const leading = match ? match[1] : "";
  const raw = match ? match[2] : original;
  const trailing = match ? match[3] : "";
  const key = raw.replace(/\s+/g, " ").trim();
  if (!key) {
    node.nodeValue = original;
    return;
  }

  const dictionary = SAVI_I18N_TEXTS[lang] || {};
  node.nodeValue = leading + (dictionary[key] || raw) + trailing;
}

function applyLanguage(lang) {
  const nextLang = SAVI_AVAILABLE_LANGS.has(lang) ? lang : "es";
  document.documentElement.lang = nextLang;
  document.body.dataset.lang = nextLang;
  try {
    localStorage.setItem("savi-lang", nextLang);
  } catch (error) {
    window.__saviLangFallback = nextLang;
  }

  document.querySelectorAll("[data-lang-option]").forEach((button) => {
    const active = button.getAttribute("data-lang-option") === nextLang;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode(node) {
        if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const parent = node.parentElement;
        if (!parent) return NodeFilter.FILTER_REJECT;
        if (parent.closest("script, style, noscript, .twk-root")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );

  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => translateTextNode(node, nextLang));
}

function getSavedLanguage() {
  try {
    return localStorage.getItem("savi-lang") || window.__saviLangFallback || "es";
  } catch (error) {
    return window.__saviLangFallback || "es";
  }
}

window.applySaviLanguage = applyLanguage;

function setupI18n() {
  if (window.__saviI18nReady) {
    applyLanguage(getSavedLanguage());
    return;
  }

  window.__saviI18nReady = true;

  document.addEventListener("click", (event) => {
    const button = event.target.closest("[data-lang-option]");
    if (!button) return;
    event.preventDefault();
    applyLanguage(button.getAttribute("data-lang-option"));
  });

  applyLanguage(getSavedLanguage());
}
