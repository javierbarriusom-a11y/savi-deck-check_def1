<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frigo 100 · Savi Centenario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Presentacion interactiva de Savi para el centenario de Frigo: engagement, fidelizacion, gamificacion, WhatsApp y first-party data.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-obsidian: #000d10;
  --color-canvas-white: #ffffff;
  --color-slate-mist: #8e8e95;
  --color-desert-sienna: #bc7155;
  --ink: var(--color-obsidian);
  --muted: var(--color-slate-mist);
  --deep: var(--color-obsidian);
  --white: var(--color-canvas-white);
  --paper: var(--color-canvas-white);
  --red: var(--color-desert-sienna);
  --blue: var(--color-obsidian);
  --ice: var(--color-canvas-white);
  --lemon: var(--color-canvas-white);
  --sans: "HelveticaNowDisplay", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --serif: var(--sans);
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --section-gap: 68px;
  --card-padding: 22px;
  --element-gap: 23px;
  --radius-other: 45px;
  --radius-full: 1000px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--color-obsidian); color: var(--ink); font-family: var(--sans); }
body { overflow: hidden; }
button { font: inherit; }

.topbar {
  position: fixed;
  z-index: 80;
  inset: 14px 18px auto;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 17px;
  padding: 11px 13px 11px 21px;
  color: var(--color-obsidian);
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(0,13,16,.16);
  border-radius: var(--radius-full);
  box-shadow: none;
  backdrop-filter: blur(18px);
  pointer-events: auto;
}
.brand { font-family: var(--sans); font-size: 20px; line-height: 1; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--color-desert-sienna); }
.nav-pills { display: flex; align-items: center; justify-content: flex-end; gap: 11px; pointer-events: auto; }
.nav-pills button, .controls button {
  border: 1px solid rgba(0,13,16,.18);
  background: transparent;
  color: var(--color-obsidian);
  min-height: 38px;
  padding: 9px 16px 10px;
  border-radius: var(--radius-full);
  cursor: pointer;
}
.nav-pills button {
  font-size: 17px;
  font-weight: 400;
  text-transform: none;
  letter-spacing: .01em;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
.nav-pills button.is-active {
  background: var(--color-obsidian);
  color: var(--color-canvas-white);
  border-color: var(--color-obsidian);
}
.nav-pills button:hover, .controls button:hover { background: var(--color-desert-sienna); color: var(--color-canvas-white); border-color: var(--color-desert-sienna); }
.section-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 8px 17px 9px;
  border-radius: var(--radius-full);
  background: var(--color-desert-sienna);
  color: var(--color-canvas-white);
  font-family: var(--sans);
  font-size: 17px;
  font-weight: 700;
  text-transform: none;
  white-space: nowrap;
}
.section-status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: var(--radius-full);
  background: currentColor;
}
.section-status strong {
  font-family: var(--sans);
  font-size: 17px;
  letter-spacing: .01em;
}

.controls {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--radius-full);
  background: var(--color-obsidian);
  color: var(--color-canvas-white);
  backdrop-filter: blur(18px);
}
.controls button { color: var(--color-canvas-white); font-size: 17px; font-weight: 700; border-color: rgba(255,255,255,.34); }
.counter { min-width: 88px; text-align: center; font-family: var(--sans); font-size: 17px; font-weight: 700; }
.progress {
  position: fixed;
  z-index: 35;
  left: 0;
  bottom: 0;
  height: 4px;
  width: 100%;
  background: rgba(255,255,255,.14);
}
.progress span { display: block; width: 0; height: 100%; background: var(--color-desert-sienna); transition: width .35s ease; }

deck-stage {
  display: block;
  width: 100vw;
  height: 100svh;
  overflow: hidden;
  position: relative;
}

section.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: clamp(68px, 6vw, 119px);
  background: var(--color-canvas-white);
  overflow: hidden;
  opacity: 0;
  transform: translateX(4%) scale(.985);
  pointer-events: none;
  transition: opacity .38s ease, transform .48s cubic-bezier(.2,.8,.2,1);
}
section.slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
section.slide.before { transform: translateX(-4%) scale(.985); }
section.slide.dark {
  background: var(--color-obsidian);
  color: var(--color-canvas-white);
}
section.slide.red,
section.slide.blue { background: var(--color-obsidian); color: var(--color-canvas-white); }
section.slide.ice,
section.slide.lemon { background: var(--color-canvas-white); color: var(--color-obsidian); }

.slide-grid {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: clamp(23px, 4vh, 68px);
}
.slide-head, .slide-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 34px;
  border-color: currentColor;
}
.slide-head { padding-bottom: 22px; border-bottom: 1px solid rgba(0,13,16,.18); }
.slide.dark .slide-head, .slide.red .slide-head, .slide.blue .slide-head,
.slide.dark .slide-foot, .slide.red .slide-foot, .slide.blue .slide-foot { border-color: rgba(255,255,255,.2); }
.slide-foot { padding-top: 22px; border-top: 1px solid rgba(0,13,16,.18); color: var(--muted); font-size: 17px; line-height: 1.45; }
.slide.dark .slide-foot, .slide.red .slide-foot, .slide.blue .slide-foot { color: rgba(255,255,255,.74); }
.eyebrow, .meta, .chip {
  font-family: var(--sans);
  text-transform: none;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: .01em;
}
.eyebrow { color: var(--muted); }
.slide.dark .eyebrow, .slide.red .eyebrow, .slide.blue .eyebrow { color: rgba(255,255,255,.72); }

.title {
  font-family: var(--sans);
  font-size: clamp(60px, 9.5vw, 187px);
  line-height: .8;
  font-weight: 700;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.02em;
}
.title.small { font-size: clamp(52px, 5.8vw, 92px); line-height: .91; letter-spacing: -.01em; }
.title.xl { font-size: clamp(72px, 14vw, 190px); }
.slide:first-child {
  padding: 0;
  background:
    linear-gradient(90deg, rgba(0,13,16,.94) 0%, rgba(0,13,16,.82) 38%, rgba(0,13,16,.42) 68%, rgba(0,13,16,.14) 100%),
    linear-gradient(0deg, rgba(0,13,16,.42), transparent 44%),
    url("assets/cover-frigo-centenario.png") center / cover no-repeat !important;
  color: var(--color-canvas-white);
}
.slide:first-child .slide-grid { position: relative; z-index: 1; height: 100%; padding: clamp(68px, 6vw, 119px); }
.slide:first-child .title { font-size: clamp(72px, 10.5vw, 187px); max-width: 1160px; }
.slide:first-child .subtitle { max-width: 760px; font-size: clamp(20px, 1.8vw, 30px); color: rgba(255,255,255,.78); }
.cover-copy { align-self: center; }
section.slide.immersive {
  background:
    linear-gradient(90deg, rgba(0,13,16,.95) 0%, rgba(0,13,16,.86) 42%, rgba(0,13,16,.62) 74%, rgba(0,13,16,.42) 100%),
    linear-gradient(0deg, rgba(0,13,16,.78) 0%, rgba(0,13,16,.26) 48%, rgba(0,13,16,.62) 100%),
    url("assets/cover-frigo-centenario.png") center / cover no-repeat !important;
  color: var(--color-canvas-white);
}
.slide.immersive .slide-grid { position: relative; z-index: 1; }
.slide.immersive .slide-head,
.slide.immersive .slide-foot { border-color: rgba(255,255,255,.2); }
.slide.immersive .slide-foot,
.slide.immersive .eyebrow { color: rgba(255,255,255,.72); }
.slide.immersive .subtitle,
.slide.immersive .body { color: rgba(255,255,255,.78); }
.slide.immersive .card,
.slide.immersive .stat-card,
.slide.immersive .timeline-item,
.slide.immersive .idea,
.slide.immersive .cell {
  border-color: rgba(255,255,255,.22);
  background: rgba(0,13,16,.54);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.slide.immersive .stat-card strong,
.slide.immersive .bar span { color: var(--color-canvas-white); }
.slide.immersive .stat-card span { color: rgba(255,255,255,.76); }
.slide.immersive .agenda-row { border-top-color: rgba(255,255,255,.22); }
.slide.immersive .matrix { border-color: rgba(255,255,255,.22); }
.slide.immersive .matrix div {
  border-color: rgba(255,255,255,.16);
  background: rgba(0,13,16,.54);
  color: rgba(255,255,255,.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.slide.immersive .matrix .head {
  background: rgba(255,255,255,.14);
  color: var(--color-canvas-white);
}
.subtitle {
  margin: 23px 0 0;
  max-width: 980px;
  font-size: clamp(20px, 1.8vw, 30px);
  line-height: 1.2;
  color: var(--muted);
  text-wrap: pretty;
  letter-spacing: .01em;
}
.slide.dark .subtitle, .slide.red .subtitle, .slide.blue .subtitle { color: rgba(255,255,255,.76); }
.body { font-size: 17px; line-height: 1.61; letter-spacing: .01em; color: var(--muted); }
.slide.dark .body, .slide.red .body, .slide.blue .body { color: rgba(255,255,255,.76); }

.content.two { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(320px, .98fr); gap: clamp(34px, 5vw, 119px); align-items: center; }
.content.split { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(34px, 5vw, 119px); align-items: stretch; }
.content.image-split {
  display: grid;
  grid-template-columns: minmax(0, .82fr) minmax(480px, 1.18fr);
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 23px clamp(34px, 5vw, 96px);
  align-items: center;
}
.content.center { display: grid; align-content: center; }
.stack { display: flex; flex-direction: column; gap: 23px; }
.grid { display: grid; gap: 23px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.card, .stat-card, .timeline-item, .idea, .cell {
  border: 1px solid rgba(0,13,16,.18);
  border-radius: var(--radius-other);
  background: var(--color-canvas-white);
  padding: clamp(22px, 2.3vw, 38px);
}
.slide.dark .card, .slide.red .card, .slide.blue .card,
.slide.dark .stat-card, .slide.red .stat-card, .slide.blue .stat-card,
.slide.dark .timeline-item, .slide.red .timeline-item, .slide.blue .timeline-item,
.slide.dark .idea, .slide.red .idea, .slide.blue .idea,
.slide.dark .cell, .slide.red .cell, .slide.blue .cell {
  border-color: rgba(255,255,255,.2);
  background: rgba(255,255,255,.06);
}
.card h3, .idea h3, .cell h3 { margin: 0; font-size: clamp(23px, 1.9vw, 37px); line-height: 1.1; letter-spacing: -.01em; font-weight: 700; }
.card p, .idea p, .cell p { margin: 13px 0 0; }
.image-copy { display: flex; flex-direction: column; gap: 23px; }
.image-copy .title.small { font-size: clamp(48px, 4.8vw, 78px); }
.image-points { grid-column: 1 / -1; }
.image-points .card { padding: 18px 22px; border-radius: 34px; }
.image-points .card h3 { font-size: clamp(21px, 1.6vw, 28px); }
.image-points .card .body { line-height: 1.35; }
.feature-photo {
  width: 100%;
  height: min(48vh, 560px);
  min-height: 420px;
  border-radius: var(--radius-other);
  border: 1px solid rgba(0,13,16,.18);
  object-fit: cover;
  display: block;
}
.num {
  font-family: var(--sans);
  font-size: clamp(63px, 8vw, 131px);
  line-height: .8;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--color-desert-sienna);
}
.compare-grid .card {
  min-height: 520px;
}
.compare-grid .num {
  font-size: clamp(44px, 4.2vw, 70px);
  line-height: .92;
  max-width: 100%;
  overflow-wrap: normal;
  word-break: normal;
}
.compare-grid .body {
  max-width: 92%;
}
.stat-card strong { display: block; font-family: var(--sans); font-size: clamp(52px, 3.9vw, 68px); line-height: .91; font-weight: 700; letter-spacing: -.02em; color: var(--color-obsidian); white-space: nowrap; }
.slide.dark .stat-card strong, .slide.red .stat-card strong, .slide.blue .stat-card strong { color: var(--color-canvas-white); }
.stat-card span { display: block; margin-top: 17px; color: var(--muted); font-size: 17px; line-height: 1.61; letter-spacing: .01em; }
.slide.dark .stat-card span, .slide.red .stat-card span, .slide.blue .stat-card span { color: rgba(255,255,255,.76); }

.agenda-list { counter-reset: agenda; display: grid; gap: 21px; }
.agenda-row {
  counter-increment: agenda;
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 34px;
  align-items: start;
  border-top: 1px solid rgba(0,13,16,.18);
  padding-top: 21px;
}
.agenda-row::before { content: counter(agenda, decimal-leading-zero); font-family: var(--sans); font-size: 20px; font-weight: 700; color: var(--color-desert-sienna); }
.agenda-row h3 { margin: 0; font-size: clamp(30px, 3vw, 52px); font-family: var(--sans); font-weight: 700; line-height: 1.09; letter-spacing: -.01em; }
.agenda-row p { margin: 11px 0 0; }

.poster {
  min-height: 560px;
  border-radius: var(--radius-other);
  border: 1px solid rgba(0,13,16,.18);
  background:
    linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.72)),
    repeating-linear-gradient(90deg, var(--color-obsidian) 0 42px, var(--color-canvas-white) 42px 84px);
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.poster.has-image {
  background: var(--color-canvas-white);
  padding: 0;
}
.poster.has-image::before,
.poster.has-image::after { content: none; }
.poster.has-image img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 560px;
  object-fit: cover;
}
.poster::before {
  content: "";
  width: min(42vw, 360px);
  aspect-ratio: .62;
  border-radius: 50% 50% 44% 44%;
  background: linear-gradient(180deg, var(--color-canvas-white) 0 46%, var(--color-desert-sienna) 46% 58%, var(--color-obsidian) 58% 100%);
  transform: rotate(-8deg);
}
.poster::after {
  content: "100";
  position: absolute;
  font-family: var(--sans);
  font-size: clamp(110px, 14vw, 210px);
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--color-obsidian);
  bottom: 28px;
  right: 36px;
}
.qr-block {
  position: absolute;
  left: 34px;
  bottom: 34px;
  width: 106px;
  height: 106px;
  background:
    linear-gradient(90deg, #111 16px, transparent 16px 26px, #111 26px 42px, transparent 42px 58px, #111 58px 78px, transparent 78px),
    linear-gradient(#111 15px, transparent 15px 28px, #111 28px 46px, transparent 46px 62px, #111 62px 80px, transparent 80px),
    #fff;
  border: 10px solid #fff;
}

.phone {
  width: min(430px, 100%);
  min-height: 620px;
  margin: 0 auto;
  border: 12px solid var(--color-obsidian);
  border-radius: 34px;
  background: var(--color-canvas-white);
  padding: 28px 20px;
}
.bubble {
  max-width: 84%;
  margin: 12px 0;
  padding: 14px 16px;
  border: 1px solid rgba(0,13,16,.16);
  border-radius: 24px;
  background: #fff;
  font-size: 17px;
  line-height: 1.45;
}
.bubble.me { margin-left: auto; background: var(--color-obsidian); color: var(--color-canvas-white); }

.journey {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 23px;
}
.journey .card { min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; }
.icon { display: inline-flex; align-items: center; justify-content: center; width: 53px; height: 53px; border: 1px solid currentColor; border-radius: var(--radius-full); color: var(--color-desert-sienna); line-height: 1; }
.icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.timeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 17px; align-items: stretch; }
.timeline-item { min-height: 260px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
.timeline-mark { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
.timeline-mark .icon { flex: 0 0 auto; width: 48px; height: 48px; }
.timeline-mark .icon svg { width: 22px; height: 22px; }
.timeline-item b { font-family: var(--sans); font-size: clamp(30px, 3.1vw, 52px); font-weight: 700; line-height: .91; letter-spacing: -.01em; color: var(--color-desert-sienna); }
.timeline-item h3 { font-size: 20px; line-height: 1.2; letter-spacing: -.01em; }
.timeline-item .body { font-size: 17px; line-height: 1.45; }

.matrix { display: grid; grid-template-columns: 190px repeat(4, 1fr); border: 1px solid rgba(0,13,16,.18); border-radius: var(--radius-other); overflow: hidden; }
.matrix div { padding: 22px; min-height: 72px; border-right: 1px solid rgba(0,13,16,.16); border-bottom: 1px solid rgba(0,13,16,.16); background: var(--color-canvas-white); font-size: 17px; line-height: 1.45; }
.matrix div:nth-child(5n) { border-right: 0; }
.matrix .head { font-family: var(--sans); text-transform: none; font-size: 17px; font-weight: 700; background: var(--color-obsidian); color: var(--color-canvas-white); }
.dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: var(--color-desert-sienna); margin-right: 11px; vertical-align: middle; }
.dot.light { background: transparent; border: 1px solid var(--color-desert-sienna); }

.bars { display: grid; gap: 17px; margin-top: 22px; }
.bar { display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 23px; }
.bar span { font-family: var(--sans); font-size: 17px; font-weight: 700; }
.bar i { display: block; height: 34px; border-radius: var(--radius-full); background: var(--color-desert-sienna); }

.roadmap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 23px; }
.roadmap .card { min-height: 310px; display: flex; flex-direction: column; justify-content: space-between; }
.phase { font-family: var(--sans); color: var(--color-desert-sienna); font-size: 17px; font-weight: 700; }

.grid.cols-5 .card,
.grid.cols-5 .idea { padding: 22px; }
.grid.cols-5 .card .icon svg { width: 22px; height: 22px; }
.grid.cols-5 .card h3,
.grid.cols-5 .idea h3 { font-size: clamp(20px, 1.45vw, 24px); }
.grid.cols-5 .card .body,
.grid.cols-5 .idea .body { font-size: 17px; line-height: 1.45; }

.dashboard {
  border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--radius-other);
  padding: 22px;
  background: var(--color-obsidian);
  color: var(--color-canvas-white);
}
.dashboard-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 17px; }
.dash-card { border: 1px solid rgba(255,255,255,.18); border-radius: 34px; padding: 22px; background: rgba(255,255,255,.06); }
.dash-card strong { display: block; font-family: var(--sans); font-size: clamp(52px, 5vw, 92px); line-height: .91; font-weight: 700; letter-spacing: -.02em; }
.spark { height: 140px; margin-top: 21px; background: linear-gradient(160deg, transparent 0 24%, var(--color-canvas-white) 25% 30%, transparent 31% 44%, var(--color-slate-mist) 45% 51%, transparent 52% 64%, var(--color-desert-sienna) 65% 70%, transparent 71%); border-bottom: 1px solid rgba(255,255,255,.22); }

.source {
  font-size: 17px;
  line-height: 1.35;
  max-width: 900px;
}
a { color: inherit; }

@media (max-width: 900px) {
  body { overflow: auto; }
  deck-stage { height: auto; overflow: visible; }
  section.slide {
    position: relative;
    height: auto;
    min-height: 100svh;
    padding: 38px 22px;
    opacity: 1;
    transform: none;
    pointer-events: auto;
    display: block;
  }
  .slide-grid { height: auto; min-height: calc(100svh - 76px); }

  {

    subtitle: "El piloto debe validar UX, opt-in, prueba de compra, catalogo y carga operativa antes de activar medios masivos.",
    layout: "roadmap",
    items: [
      ["Semanas 1-3", "Workshop & setup", "KPIs, mecanicas prioritarias, flujo WhatsApp, legal y catalogo de premios."],
      ["Semanas 4-7", "Piloto Madrid", "Canal impulso + restauracion. Validacion real de QR, selfie/ticket y tasas de opt-in."],
      ["Semanas 8-12", "Lanzamiento nacional", "Ajuste de UX, antifraude, pacing, mecanicas y plan de medios/trade."]
    ]
  },
  {
    eyebrow: "06 · Por que Savi",
    title: "La plataforma de engagement mas flexible para activar el centenario.",
    subtitle: "Savi combina activacion, validacion, gamificacion, reward marketplace, dashboard y soporte operativo.",
    layout: "cards",
    cols: 3,
    items: [
      ["WhatsApp + OCR + geofencing", "Instant Win, validacion y antifraude integrados."],
      ["Mecanicas listas", "Gamificacion activable sin desarrollo desde cero."],
      ["Setup en semanas", "Piloto en 7 semanas con medicion real."],
      ["+50 marcas", "Activaciones gestionadas por el equipo Savi."],
      ["2M+ participaciones", "Volumen operativo gestionado en campanas."],
      ["Cornetto impulse case", "QR + instant win como referencia directa para canal impulso."]
    ]
  },
  {
    theme: "dark",
    eyebrow: "Cierre",
    title: "Just One Frigo.",
    subtitle: "100 años de historia. Un programa para construir los proximos 100.",
    layout: "closing",
    items: [
      ["Workshop de alineamiento", "2h con Marketing para definir objetivos, KPIs y mecanicas."],
      ["Propuesta definitiva", "Customer journey, flujos WhatsApp, catalogo y plan tecnico-operativo."],
      ["Piloto y lanzamiento", "Test en mercado, medicion, ajustes y escalado nacional."]
    ],
    foot: "savi · Marketing that works for everyone · hola@savi.es · savi.es"

];

const deck = document.getElementById("deck");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const sectionName = document.getElementById("sectionName");
let current = Math.max(0, Math.min(slides.length - 1, Number(location.hash.replace("#slide-", "")) - 1 || 0));

const iconLibrary = {
  qr: `<path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M14 14h2v2h-2z"/><path d="M18 14h2v6h-4v-2"/><path d="M14 18h2"/>`,
  check: `<path d="M20 6 9 17l-5-5"/><path d="M21 12a9 9 0 1 1-5.3-8.2"/>`,
  game: `<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 7H4a3 3 0 0 0 3 3"/><path d="M17 7h3a3 3 0 0 1-3 3"/>`,
  users: `<path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>`,
  database: `<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>`,
  phone: `<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>`,
  chat: `<path d="M21 12a8 8 0 0 1-8 8H6l-4 2 2-5.4A8 8 0 1 1 21 12z"/><path d="M8 12h8"/><path d="M8 8h6"/>`,
  target: `<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>`,
  camera: `<path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/>`,
  receipt: `<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/>`,
  pin: `<path d="M12 21s7-5.3 7-12a7 7 0 0 0-14 0c0 6.7 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>`,
  key: `<circle cx="7.5" cy="14.5" r="3.5"/><path d="M10 12 21 3"/><path d="m16 8 2 2"/><path d="m19 5 2 2"/>`,
  clock: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`,
  box: `<path d="m3 7 9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>`,
  spark: `<path d="M12 2v7"/><path d="M12 15v7"/><path d="M2 12h7"/><path d="M15 12h7"/><path d="m5 5 4 4"/><path d="m15 15 4 4"/><path d="m19 5-4 4"/><path d="m9 15-4 4"/>`,
  chart: `<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 5-7"/>`,
  shield: `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-5"/>`,
  factory: `<path d="M3 21h18"/><path d="M5 21V9l5 3V9l5 3V5h4v16"/><path d="M8 17h1"/><path d="M12 17h1"/><path d="M16 17h1"/>`,
  cone: `<path d="m8 10 4 11 4-11"/><path d="M8 10h8"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="m10 15 4-2"/><path d="m11 18 3-2"/>`,
  volume: `<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/>`,
  heart: `<path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 1 0-7.4 7.4L12 21l8.8-8a5.2 5.2 0 0 0 0-7.4z"/>`,
  celebration: `<path d="m4 20 5-14 9 9z"/><path d="m7 17 6-6"/><path d="M15 5h.01"/><path d="M19 3h.01"/><path d="M21 8h.01"/><path d="M18 11h.01"/>`
};

const fallbackIcons = ["qr", "check", "game", "users", "database", "phone", "chat", "target", "camera", "receipt", "pin", "key", "clock", "box", "spark"];

function normalizeIconText(text) {
  return String(text || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function iconFor(label, index = 0) {
  const text = normalizeIconText(label);
  let key = fallbackIcons[index % fallbackIcons.length];
  if (text.includes("qr") || text.includes("cartel") || text.includes("escanea")) key = "qr";
  else if (text.includes("selfie") || text.includes("foto") || text.includes("ugc")) key = "camera";
  else if (text.includes("ticket") || text.includes("ocr")) key = "receipt";
  else if (text.includes("geofencing") || text.includes("punto") || text.includes("ciudad") || text.includes("local")) key = "pin";
  else if (text.includes("keyword") || text.includes("pincode") || text.includes("codigo")) key = "key";
  else if (text.includes("whatsapp") || text.includes("app") || text.includes("telefono")) key = "phone";
  else if (text.includes("comunidad") || text.includes("squads") || text.includes("embajador") || text.includes("family") || text.includes("fan")) key = "users";
  else if (text.includes("data") || text.includes("rfm") || text.includes("kpi") || text.includes("dashboard") || text.includes("medicion")) key = "database";
  else if (text.includes("juego") || text.includes("ruleta") || text.includes("instant") || text.includes("premio") || text.includes("gana") || text.includes("nivel") || text.includes("bingo") || text.includes("album")) key = "game";
  else if (text.includes("compra") || text.includes("valid") || text.includes("antifraude") || text.includes("compliance")) key = "check";
  else if (text.includes("social") || text.includes("convers") || text.includes("recuerdo")) key = "chat";
  else if (text.includes("futuro") || text.includes("tiempo") || text.includes("time") || text.includes("historia")) key = "clock";
  else if (text.includes("fundacion") || text.includes("barcelona") || text.includes("fabricante")) key = "factory";
  else if (text.includes("cono") || text.includes("cucurucho")) key = "cone";
  else if (text.includes("jingle") || text.includes("just one")) key = "volume";
  else if (text.includes("heartbrand") || text.includes("identidad global")) key = "heart";
  else if (text.includes("100 anos") || text.includes("celebrar")) key = "celebration";
  else if (text.includes("packaging") || text.includes("retailer") || text.includes("sku") || text.includes("producto") || text.includes("portfolio")) key = "box";
  else if (text.includes("frecuencia") || text.includes("reto") || text.includes("challenge") || text.includes("flash")) key = "target";
  else if (text.includes("impacto") || text.includes("activacion") || text.includes("acquisition") || text.includes("retention")) key = "chart";
  return iconLibrary[key];
}

function safe(text) {
  return String(text || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
}

function header(slide, i) {
  return `
    <div class="slide-head">
      <div class="brand">savi<span>.</span></div>
      <div class="eyebrow">${safe(slide.eyebrow || "")}</div>
      <div class="meta">${String(i + 1).padStart(2, "0")} / ${slides.length}</div>
    </div>`;
}

function footer(slide) {
  const source = slide.foot ? safe(slide.foot) : "Frigo 100 · propuesta visual interactiva · Savi";
  return `<div class="slide-foot"><div class="source">${source}</div><div>Inicio · Atras · Siguiente</div></div>`;
}

function titleBlock(slide, small = false) {
  return `
    <div>
      <h1 class="title ${small ? "small" : ""}">${safe(slide.title)}</h1>
      ${slide.subtitle ? `<p class="subtitle">${safe(slide.subtitle)}</p>` : ""}
    </div>`;
}

function renderCards(items = [], cols = 3) {
  return `<div class="grid cols-${cols}">${items.map((item, idx) => `
    <article class="card">
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${iconFor(item[0], idx)}</svg></div>
      <h3>${safe(item[0])}</h3>
      <p class="body">${safe(item[1])}</p>
    </article>`).join("")}</div>`;
}

function layout(slide, i) {
  if (slide.layout === "cover") {
    return `<div class="cover-copy">${titleBlock(slide)}</div>`;
  }
  if (slide.layout === "agenda") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="agenda-list">${slide.items.map((item) => `
      <div class="agenda-row"><div><h3>${safe(item[0])}</h3><p class="body">${safe(item[1])}</p></div></div>`).join("")}</div></div>`;
  }
  if (slide.layout === "chapter") {
    return `<div class="content center">${titleBlock(slide)}</div>`;
  }
  if (slide.layout === "stats") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="grid cols-4">${slide.stats.map((stat) => `
      <article class="stat-card"><strong>${safe(stat[0])}</strong><span>${safe(stat[1])}</span></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "timeline") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="timeline">${slide.items.map((item) => `
      <article class="timeline-item"><div class="timeline-mark"><b>${safe(item[0])}</b><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${iconFor(`${item[1]} ${item[2]}`)}</svg></span></div><div><h3>${safe(item[1])}</h3><p class="body">${safe(item[2])}</p></div></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "compare") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="grid cols-2 compare-grid">${slide.items.map((item) => `
      <article class="card"><div class="num">${safe(item[0])}</div><p class="body">${safe(item[1])}</p></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "image-split") {
    return `<div class="content image-split"><div class="image-copy">${titleBlock(slide, true)}</div><img class="feature-photo" src="${safe(slide.image)}" alt="Familia comprando un helado Frigo en un punto de venta de playa"><div class="image-points">${renderCards(slide.items, 3)}</div></div>`;
  }
  if (slide.layout === "poster") {
    const poster = slide.image
      ? `<div class="poster has-image"><img src="${safe(slide.image)}" alt="Collage de carteles Frigo de helados en puntos de venta"></div>`
      : `<div class="poster"><div class="qr-block"></div></div>`;
    return `<div class="content two"><div>${titleBlock(slide, true)}${renderCards(slide.items, 2)}</div>${poster}</div>`;
  }
  if (slide.layout === "journey") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="journey">${slide.items.map((item, idx) => `
      <article class="card"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${iconFor(item[0], idx)}</svg></div><div><h3>${safe(item[0])}</h3><p class="body">${safe(item[1])}</p></div></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "phone") {
    return `<div class="content two"><div>${titleBlock(slide, true)}${renderCards(slide.items, 5)}</div><div class="phone">
      <div class="bubble">Hola, soy Frigo. Escanea el cartel y desbloquea tu Momento 100.</div>
      <div class="bubble me">Ya tengo mi ticket.</div>
      <div class="bubble">Perfecto. Validado. Has ganado 40 puntos y una tirada en la Ruleta del 100.</div>
      <div class="bubble me">Quiero ver mi nivel.</div>
      <div class="bubble">Estas a 60 puntos de Fan Classico.</div>
    </div></div>`;
  }
  if (slide.layout === "ideas") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="grid cols-5">${slide.items.map((item, idx) => `
      <article class="idea"><div class="num">${String.fromCharCode(65 + idx)}</div><h3>${safe(item[0])}</h3><p class="body">${safe(item[1])}</p></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "matrix") {
    const heads = ["Objetivo", "Front / canal", "Core rules", "Validacion", "Output"];
    return `<div class="stack">${titleBlock(slide, true)}<div class="matrix">${heads.map((h) => `<div class="head">${h}</div>`).join("")}${slide.rows.map((row) => row.map((cell, idx) => `<div>${idx === 0 ? "<span class='dot'></span>" : ""}${safe(cell)}</div>`).join("")).join("")}</div></div>`;
  }
  if (slide.layout === "dashboard") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="dashboard">
      <div class="dashboard-grid">${slide.items.map((item) => `<div class="dash-card"><span class="meta">${safe(item[0])}</span><strong>${safe(item[1])}</strong></div>`).join("")}</div>
      <div class="spark"></div>
      <div class="bars">
        <div class="bar"><span>Madrid</span><i style="width:92%"></i></div>
        <div class="bar"><span>Levante</span><i style="width:74%"></i></div>
        <div class="bar"><span>Andalucia</span><i style="width:66%"></i></div>
      </div>
    </div></div>`;
  }
  if (slide.layout === "bars") {
    return `<div class="content split">${titleBlock(slide, true)}<div class="bars">${slide.items.map((item) => `
      <div class="bar"><span>${safe(item[0])}</span><i style="width:${safe(item[1])}%"></i></div>`).join("")}</div></div>`;
  }
  if (slide.layout === "roadmap") {
    return `<div class="stack">${titleBlock(slide, true)}<div class="roadmap">${slide.items.map((item) => `
      <article class="card"><div class="phase">${safe(item[0])}</div><h3>${safe(item[1])}</h3><p class="body">${safe(item[2])}</p></article>`).join("")}</div></div>`;
  }
  if (slide.layout === "closing") {
    return `<div class="content split">${titleBlock(slide)}${renderCards(slide.items, 3)}</div>`;
  }
  return `<div class="stack">${titleBlock(slide, true)}${renderCards(slide.items, slide.cols || 3)}</div>`;
}

const immersiveLayouts = new Set([
  "agenda",
  "stats",
  "timeline",
  "cards",
  "compare",
  "journey",
  "ideas",
  "matrix",
  "bars",
  "roadmap"
]);

function slideClass(slide) {
  const classes = ["slide"];
  if (slide.theme) classes.push(slide.theme);
  if (immersiveLayouts.has(slide.layout) && !slide.image) classes.push("immersive");
  return classes.join(" ");
}

function render() {
  deck.innerHTML = slides.map((slide, i) => `
    <section class="${slideClass(slide)}" id="slide-${i + 1}" data-index="${i}">
      <div class="slide-grid">
        ${header(slide, i)}
        ${layout(slide, i)}
        ${footer(slide)}
      </div>
    </section>`).join("");
}

function getActiveSection(index) {
  return [...document.querySelectorAll("[data-jump]")]
    .map((button) => ({ button, jump: Number(button.dataset.jump) }))
    .filter((item) => item.jump <= index)
    .sort((a, b) => b.jump - a.jump)[0];
}

function update(next) {
  current = Math.max(0, Math.min(slides.length - 1, next));
  document.querySelectorAll(".slide").forEach((section, i) => {
    section.classList.toggle("active", i === current);
    section.classList.toggle("before", i < current);
  });
  counter.textContent = `${String(current + 1).padStart(2, "0")} / ${slides.length}`;
  progress.style.width = `${((current + 1) / slides.length) * 100}%`;
  const activeSection = getActiveSection(current);
  document.querySelectorAll("[data-jump]").forEach((button) => {
    const active = button === activeSection?.button;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-current", active ? "true" : "false");
  });
  if (activeSection && sectionName) sectionName.textContent = activeSection.button.textContent.trim();
  history.replaceState(null, "", `#slide-${current + 1}`);
}

render();
update(current);

document.getElementById("next").addEventListener("click", () => update(current + 1));
document.getElementById("prev").addEventListener("click", () => update(current - 1));
document.getElementById("home").addEventListener("click", () => update(0));
document.querySelectorAll("[data-jump]").forEach((button) => button.addEventListener("click", () => update(Number(button.dataset.jump))));
deck.addEventListener("click", (event) => {
  if (event.target.closest("a, button")) return;
  update(current + 1);
});
window.addEventListener("keydown", (event) => {
  if (["ArrowRight", "PageDown", " "].includes(event.key)) update(current + 1);
  if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) update(current - 1);
  if (event.key === "Home") update(0);
  if (event.key === "End") update(slides.length - 1);
});
window.addEventListener("hashchange", () => {
  const index = Number(location.hash.replace("#slide-", "")) - 1;
  if (!Number.isNaN(index)) update(index);
});
</script>
